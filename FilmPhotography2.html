<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Film Photography- Owen Denver Emerson</title>

<style>
  :root{
    --bg: #ffffff;
    --gap: 8px;
    --col-min: 220px;
    --overlay-bg: rgba(0,0,0,.72);
    --back-size: 36px;
    --fade-cell: 60px;
  }

  html,body{
    height:100%;
    background:var(--bg);
    margin:0;
    padding:0;
    overflow-x:hidden;
    color:#111;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
  }

  /* Back arrow */
.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 1.8rem;
  color: #222;
  text-decoration: none;
  z-index: 10001;
  transition: transform 0.15s ease, opacity 0.2s ease;
}
.back-btn:hover {
  transform: translateX(-3px);
  opacity: 0.7;
}

  /* Masonry grid container (common to both CSS + JS versions) */
  .gallery{
    padding: calc(var(--gap) + 16px);
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
  }

  /* CSS masonry for browsers that support grid-template-rows: masonry */
  .gallery.masonry-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--col-min), 1fr));
    gap: var(--gap);
    grid-auto-flow: dense;
    grid-template-rows: masonry;
  }

  .tile{
    display:block;
    margin: 0 0 var(--gap) 0;
    border-radius: 0;
    overflow:hidden;
    background:#f6f6f6;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
    position:relative;
  }
  .tile img{
    width:100%;
    height:auto;
    display:block;
    vertical-align:bottom;
    object-fit:cover;
  }

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0;
    background:var(--overlay-bg);
    display:none;
    align-items:center; justify-content:center;
    z-index:10000;
    padding:24px;
  }
  .lightbox.open{ display:flex; }
  .lightbox__inner{
    position:relative; max-width: min(1400px, 96vw); max-height: 90vh;
  }
  .lightbox__img{
    max-width:100%; max-height:90vh;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .lightbox__close{
    position:absolute; top:8px; left:8px;
    width:36px; height:36px; border-radius:8px; border:0;
    display:grid; place-items:center;
    background:#000; color:#fff; cursor:pointer;
  }

  /* Startup fade */
  #white-transition{
    position:fixed; inset:0;
    background:#000;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--fade-cell), 1fr));
    grid-auto-rows: var(--fade-cell);
    z-index: 10002;
    pointer-events:none;
  }
  .white-block{ background:#fff; opacity:0; transition:none; }

  @media (max-width: 720px){
    :root{ --gap: 6px; --col-min: 170px; }
  }
  @media (max-width: 420px){
    :root{ --col-min: 150px; }
  }
</style>
</head>

<body>
<!-- Back button -->
<a class="back-btn" href="work.html" aria-label="Back to Work">←
</a>

<!-- Gallery -->
<main id="gallery" class="gallery" aria-live="polite"></main>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
  <div class="lightbox__inner">
    <button class="lightbox__close" aria-label="Close (Esc)">&times;</button>
    <img id="lightbox-img" class="lightbox__img" alt="" />
  </div>
</div>

<!-- Fade transition -->
<div id="white-transition" aria-hidden="true"></div>

<script>
// ===== CONFIG =====
// Corrected for GitHub Pages under /owendenveremerson/
const REPO_BASE = "/owenemerson4-jpg.github.io/";

// Thumbnail + full-res roots (Option A structure)
const THUMB_BASE_PATH = REPO_BASE + "websitephotos/thumbs/";
const FULL_BASE_PATH  = REPO_BASE + "websitephotos/full/";

const MANIFEST_URL = REPO_BASE + "photolist.json";

const BATCH_SIZE = 60;

// ===== Lightbox logic =====
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add("open");
}
function closeLightbox(){
  lightbox.classList.remove("open");
  lightboxImg.src="";
}
lightbox.addEventListener("click", e => { if(e.target===lightbox) closeLightbox(); });
lightbox.querySelector(".lightbox__close").addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => { if(e.key==="Escape") closeLightbox(); });


// ===== MiniMasonry fallback (for browsers without CSS masonry) =====
class MiniMasonry {
  constructor(options){
    this.container = typeof options.container === "string"
      ? document.querySelector(options.container)
      : options.container;
    this.baseWidth = options.baseWidth || 260;
    this.gutter = options.gutter || 8;
    this.handleResize = this.layout.bind(this);
    window.addEventListener("resize", this.handleResize);
  }

  layout(){
    const container = this.container;
    if(!container) return;
    const items = Array.from(container.children);
    if(!items.length) return;

    const containerWidth = container.clientWidth;
    if(!containerWidth) return;

    const colWidth = this.baseWidth + this.gutter;
    const columns = Math.max(1, Math.floor((containerWidth + this.gutter) / colWidth));
    const colHeights = new Array(columns).fill(0);

    const itemWidth = (containerWidth - this.gutter * (columns - 1)) / columns;

    container.style.position = "relative";

    items.forEach(el => {
      el.style.position = "absolute";
      el.style.width = itemWidth + "px";
      el.style.margin = "0";

      const minCol = colHeights.indexOf(Math.min(...colHeights));
      const left = minCol * (itemWidth + this.gutter);
      const top = colHeights[minCol];

      el.style.transform = "translate(" + left + "px," + top + "px)";
      colHeights[minCol] += el.offsetHeight + this.gutter;
    });

    container.style.height = Math.max(...colHeights) + "px";
  }

  destroy(){
    window.removeEventListener("resize", this.handleResize);
  }
}


// ===== Gallery logic =====
const gallery=document.getElementById("gallery");
let canonicalNames = [];
let appendedWraps=0;

// Detect CSS masonry support
const supportsCssMasonry = typeof CSS !== "undefined" &&
  CSS.supports &&
  CSS.supports("grid-template-rows", "masonry");

let miniMasonry = null;

function initLayoutEngine(){
  if(supportsCssMasonry){
    // Modern browsers: pure CSS masonry grid
    gallery.classList.add("masonry-grid");
  }else{
    // Older Safari / anything without CSS masonry: MiniMasonry fallback
    const colMin = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--col-min")) || 220;
    const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--gap")) || 8;
    miniMasonry = new MiniMasonry({
      container: gallery,
      baseWidth: colMin,
      gutter: gap
    });
  }
}

// Create a tile using thumbnail, store full-res for lightbox
function makeTile(name){
  const a=document.createElement("a");
  a.className="tile";
  const fullSrc = FULL_BASE_PATH + name;
  const thumbSrc = THUMB_BASE_PATH + name;
  a.href = fullSrc;

  const img=document.createElement("img");
  img.loading="lazy";
  img.decoding="async";
  img.fetchPriority = "low";
  img.src = thumbSrc;
  img.dataset.full = fullSrc;
  img.alt="";

  a.appendChild(img);

  a.addEventListener("click",e=>{
    e.preventDefault();
    openLightbox(img.dataset.full);
  });

  return {el:a};
}

// Build sorted gallery using precomputed HSL (no heavy decode)
async function buildColorSortedGallery(records){
  if(!records.length)return;

  const sorted = records.slice().sort((a,b)=>
    a.h===b.h ? a.l-b.l : a.h-b.h
  );

  canonicalNames = sorted.map(rec => rec.name);

  renderInitial();
  window.addEventListener("scroll", maybeAppendWrap);
}

function renderInitial(){
  gallery.innerHTML="";
  const frag=document.createDocumentFragment();
  canonicalNames.forEach(name => {
    const tile = makeTile(name);
    frag.appendChild(tile.el);
  });
  gallery.appendChild(frag);
  appendedWraps=1;

  if(miniMasonry){
    requestAnimationFrame(()=>miniMasonry.layout());
  }
}

function maybeAppendWrap(){
  const doc = document.documentElement;
  if(doc.scrollTop + doc.clientHeight > doc.scrollHeight - 600){
    appendNextWrap();
  }
}

function appendNextWrap(){
  if(!canonicalNames.length) return;

  const startIndex=(appendedWraps*BATCH_SIZE)%canonicalNames.length;
  const frag=document.createDocumentFragment();

  for(let i=0;i<BATCH_SIZE;i++){
    const idx=(startIndex+i)%canonicalNames.length;
    const tile = makeTile(canonicalNames[idx]);
    frag.appendChild(tile.el);
  }

  gallery.appendChild(frag);
  appendedWraps++;

  if(miniMasonry){
    requestAnimationFrame(()=>miniMasonry.layout());
  }
}

// ===== Load from photolist.json =====
// Expects: [{name:"file.jpg",h:0.1,s:0.3,l:0.5}, ...]
async function loadImages(){
  try{
    const res=await fetch(MANIFEST_URL);
    const list=await res.json();

    console.log("Photo list loaded:", list);
    await buildColorSortedGallery(list);
  }catch(err){
    console.error("Failed to load photolist.json:",err);
    gallery.textContent="⚠️ Could not load photo list.";
  }
}

document.addEventListener("DOMContentLoaded", () => {
  initLayoutEngine();
  loadImages();
});

// ===== Fade-in transition (unchanged) =====
document.addEventListener("DOMContentLoaded",()=>{
  const container=document.getElementById("white-transition");
  const cellSize=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fade-cell')) || 60;
  const cols=Math.ceil(window.innerWidth/cellSize);
  const rows=Math.ceil(window.innerHeight/cellSize);
  const total=cols*rows;
  for(let i=0;i<total;i++){
    const b=document.createElement("div");
    b.className="white-block";
    container.appendChild(b);
  }
  const blocks=Array.from(container.children);
  blocks.sort(()=>Math.random()-0.5);
  let index=0;
  const step=25;
  const interval=setInterval(()=>{
    for(let i=0;i<step&&index<blocks.length;i++,index++){
      blocks[index].style.opacity=1;
    }
    if(index>=blocks.length){
      clearInterval(interval);
      setTimeout(()=>{
        container.style.transition="opacity 0.3s ease-out";
        container.style.opacity=0;
        setTimeout(()=>container.remove(),400);
      },150);
    }
  },25);
});
</script>
</body>
</html>
