<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Headshots- Owen Denver Emerson</title>

<style>
  :root{
    --bg: #ffffff;
    --gap: 8px;
    --col-min: 220px;
    --overlay-bg: rgba(0,0,0,.72);
    --back-size: 36px;
    --fade-cell: 60px;
  }

  html,body{
    height:100%;
    background:var(--bg);
    margin:0;
    padding:0;
    overflow-x:hidden;
    color:#111;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
  }

  /* Back arrow */
.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 1.8rem;
  color: #222;
  text-decoration: none;
  z-index: 10001;
  transition: transform 0.15s ease, opacity 0.2s ease;
}
.back-btn:hover {
  transform: translateX(-3px);
  opacity: 0.7;
}

  /* Masonry grid (JS-controlled) */
  .gallery{
    padding: calc(var(--gap) + 16px);
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
  }
  .tile{
    display:block;
    margin: 0 0 var(--gap) 0;
    border-radius: 0;
    overflow:hidden;
    background:#f6f6f6;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
    position:absolute;
    left:0;
    top:0;
  }
  .tile img{
    width:100%;
    height:auto;
    display:block;
    object-fit:cover;
  }

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0;
    background:var(--overlay-bg);
    display:none;
    align-items:center; justify-content:center;
    z-index:10000;
    padding:24px;
  }
  .lightbox.open{ display:flex; }
  .lightbox__inner{
    position:relative; max-width: min(1400px, 96vw); max-height: 90vh;
  }
  .lightbox__img{
    max-width:100%; max-height:90vh;
    border-radius: 0px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .lightbox__close{
    position:absolute; top:8px; left:8px;
    width:36px; height:36px; border-radius:0px; border:0;
    display:grid; place-items:center;
    background:#000; color:#fff; cursor:pointer;
  }

  /* Startup fade */
  #white-transition{
    position:fixed; inset:0;
    background:#000;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--fade-cell), 1fr));
    grid-auto-rows: var(--fade-cell);
    z-index: 10002;
    pointer-events:none;
  }
  .white-block{ background:#fff; opacity:0; transition:none; }

  @media (max-width: 720px){
    :root{ --gap: 6px; --col-min: 170px; }
  }
  @media (max-width: 420px){
    :root{ --col-min: 150px; }
  }
</style>
</head>

<body>

<a class="back-btn" href="work.html" aria-label="Back to Work">←</a>

<main id="gallery" class="gallery" aria-live="polite"></main>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
  <div class="lightbox__inner">
    <button class="lightbox__close">&times;</button>
    <img id="lightbox-img" class="lightbox__img" alt="">
  </div>
</div>

<div id="white-transition"></div>

<script>
// ===== CONFIG =====
const REPO_BASE = "/owenemerson4-jpg.github.io/";

const THUMB_BASE_PATH = REPO_BASE + "headshotimages/thumbs/";
const FULL_BASE_PATH  = REPO_BASE + "headshotimages/full/";

const MANIFEST_URL = REPO_BASE + "photolist2.json";
const BATCH_SIZE = 60;

// ===== Lightbox =====
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add("open");
}
function closeLightbox(){
  lightbox.classList.remove("open");
  lightboxImg.src = "";
}
lightbox.addEventListener("click", e => { if(e.target===lightbox) closeLightbox(); });
document.querySelector(".lightbox__close").addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => { if(e.key==="Escape") closeLightbox(); });

// ===== Masonry Layout =====
const gallery = document.getElementById("gallery");
let canonical = [], appendedWraps = 0;
let masonryRaf = null;

function getCssNumber(name, fallback){
  const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
  return Number.isFinite(v) ? v : fallback;
}

function layoutMasonry(){
  const items = [...gallery.children];
  if(!items.length) return;

  const gap = getCssNumber("--gap", 8);
  const colMin = getCssNumber("--col-min", 220);
  const width = gallery.clientWidth;

  const colWidthTotal = colMin + gap;
  const cols = Math.max(1, Math.floor((width + gap) / colWidthTotal));
  const colW = (width - gap * (cols - 1)) / cols;

  const heights = new Array(cols).fill(0);

  for(const item of items){
    item.style.width = colW + "px";

    const colIndex = heights.indexOf(Math.min(...heights));
    const x = colIndex * (colW + gap);
    const y = heights[colIndex];

    item.style.left = x + "px";
    item.style.top = y + "px";
    heights[colIndex] = y + item.offsetHeight + gap;
  }

  gallery.style.height = Math.max(...heights) + "px";
}

function requestMasonry(){
  if(masonryRaf) cancelAnimationFrame(masonryRaf);
  masonryRaf = requestAnimationFrame(() => {
    layoutMasonry();
    masonryRaf = null;
  });
}

function makeTile(name){
  const a = document.createElement("a");
  a.className = "tile";
  a.href = FULL_BASE_PATH + name;

  const img = document.createElement("img");
  img.src = THUMB_BASE_PATH + name;
  img.dataset.full = FULL_BASE_PATH + name;
  img.loading = "lazy";
  img.decoding = "async";

  img.addEventListener("load", requestMasonry);
  img.addEventListener("error", requestMasonry);

  a.appendChild(img);
  a.addEventListener("click", e => {
    e.preventDefault();
    openLightbox(img.dataset.full);
  });

  return a;
}

async function buildGallery(records){
  const sorted = records.slice().sort((a,b)=>
    a.h===b.h ? a.l-b.l : a.h-b.h
  );

  canonical = sorted.map(rec => makeTile(rec.name));
  renderInitial(canonical);

  window.addEventListener("scroll", maybeAppend);
  window.addEventListener("resize", requestMasonry);
}

function renderInitial(list){
  gallery.innerHTML = "";
  const f = document.createDocumentFragment();
  list.forEach(el => f.appendChild(el));
  gallery.appendChild(f);
  appendedWraps = 1;
  requestMasonry();
}

function maybeAppend(){
  const d = document.documentElement;
  if(d.scrollTop + d.clientHeight > d.scrollHeight - 600){
    appendWrap();
  }
}

function appendWrap(){
  const start = (appendedWraps * BATCH_SIZE) % canonical.length;
  const f = document.createDocumentFragment();

  for(let i=0; i<BATCH_SIZE; i++){
    const idx = (start + i) % canonical.length;
    const src = canonical[idx];

    const tile = src.cloneNode(false);
    const imgOrig = src.querySelector("img");
    const img = imgOrig.cloneNode(false);

    img.src = imgOrig.src;
    img.dataset.full = imgOrig.dataset.full;

    img.addEventListener("load", requestMasonry);
    img.addEventListener("error", requestMasonry);

    tile.appendChild(img);
    tile.addEventListener("click", e => {
      e.preventDefault();
      openLightbox(img.dataset.full);
    });

    f.appendChild(tile);
  }

  gallery.appendChild(f);
  appendedWraps++;
  requestMasonry();
}

// ===== Load photolist2.json =====
async function loadImages(){
  try{
    const res = await fetch(MANIFEST_URL);
    const list = await res.json();
    buildGallery(list);
  } catch(err){
    gallery.textContent = "⚠️ Could not load photolist2.json";
  }
}
document.addEventListener("DOMContentLoaded", loadImages);

// ===== Fade-in transition (unchanged) =====
document.addEventListener("DOMContentLoaded", () => {
  const cont = document.getElementById("white-transition");
  const cell = getCssNumber("--fade-cell", 60);
  const cols = Math.ceil(window.innerWidth / cell);
  const rows = Math.ceil(window.innerHeight / cell);
  const total = cols * rows;

  for(let i=0;i<total;i++){
    const b = document.createElement("div");
    b.className = "white-block";
    cont.appendChild(b);
  }

  const blocks = [...cont.children].sort(() => Math.random() - 0.5);
  let index = 0;
  const step = 25;

  const interval = setInterval(() => {
    for(let i=0;i<step && index<blocks.length;i++,index++){
      blocks[index].style.opacity = 1;
    }
    if(index>=blocks.length){
      clearInterval(interval);
      setTimeout(()=>{
        cont.style.transition = "opacity 0.3s ease-out";
        cont.style.opacity = 0;
        setTimeout(()=>cont.remove(),400);
      },150);
    }
  },25);
});
</script>
</body>
</html>
